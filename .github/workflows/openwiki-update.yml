name: OpenWiki Update

on:
  workflow_dispatch:

# Optional CI integration. Keep this manual-only until the repository-level
# OPENAI_API_KEY secret is configured. Add a schedule only when the team
# intentionally enables automatic OpenWiki updates.

# Prevent two documentation writers from running concurrently in CI.
concurrency:
  group: openwiki-update-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki@0.2.0 mermaid@11.16.0 jsdom@29.1.1

      - name: Update OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENWIKI_MODEL_ID: gpt-5.6-terra
          OPENWIKI_TELEMETRY_DISABLED: "1"

      - name: Create documentation pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          delete-branch: true
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            Review generated claims against current source and tests before merging.
